# IMPORTANT: this stack must be deployed from a build context that includes
# this repo (the Dockerfile, server/, frontend/, etc.) — e.g. Portainer's
# "Stacks -> Add stack -> Repository" option pointed at this repo/branch,
# or `docker compose up` run from a local clone. Pasting just this file into
# Portainer's "Web editor" has no build context, so Docker can't build the
# image and will instead try to PULL "swyftech-quote-app:latest" from a
# registry — which fails, since this image is never published anywhere
# ("pull access denied ... repository does not exist"). `pull_policy: build`
# below makes that failure mode clearer (a build error instead of a pull/auth
# error) if it happens, but it does not create a build context.
services:
  swyftech-quote-app:
    build: .
    image: swyftech-quote-app:latest
    pull_policy: build
    container_name: swyftech-quote-app
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"

      # Point this at your existing Ollama/Open WebUI instance on Unraid.
      # If Ollama is on the host (not this same Docker network), use the
      # Unraid box's LAN IP, e.g. http://10.0.20.5:11434
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1"

      # Optional: Google Gemini as an alternative AI provider for the quote
      # summary draft. Get a key at https://aistudio.google.com/apikey
      GEMINI_API_KEY: ""
      GEMINI_MODEL: "gemini-2.5-flash"

      # SMTP relay used to send quote emails to clients.
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "quotes@swyftech.example"
      SMTP_PASS: "changeme"
      MAIL_FROM: "SwyfTech LLC <quotes@swyftech.example>"
      # Optional: send yourself a copy of every quote email sent.
      MAIL_BCC: "jacob@swyftech.example"
    # If Ollama runs in another Docker Compose project/network on the same
    # host, either put both on a shared external network, or just use the
    # host's LAN IP in OLLAMA_BASE_URL above instead of a service name.
    # networks:
    #   - wolfden

# networks:
#   wolfden:
#     external: true
