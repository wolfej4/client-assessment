# This stack pulls a pre-built image from GitHub Container Registry (built
# and pushed by .github/workflows/docker-publish.yml on every push to main)
# instead of building locally. That makes it deployable from any Docker UI
# or tool — including ones that don't support a `build:` directive and just
# do a plain `docker pull` (several Portainer-alternative "stack" tools are
# pull-only; pasting a compose file with `build: .` into one of those fails
# with "pull access denied ... repository does not exist", since there was
# never a real image to pull).
#
# First-time setup: after the image has been pushed at least once, either
# make the ghcr.io package public (repo -> Packages -> swyftech-quote-app ->
# Package settings -> Change visibility), or run `docker login ghcr.io` on
# the Docker host with a GitHub personal access token that has `read:packages`.
#
# For local development, build directly instead: `docker build -t
# swyftech-quote-app .` (see "Building the production image manually" in
# the README), or add a `build: .` override in a docker-compose.override.yml.
services:
  swyftech-quote-app:
    image: ghcr.io/wolfej4/swyftech-quote-app:latest
    container_name: swyftech-quote-app
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"

      # Point this at your existing Ollama/Open WebUI instance on Unraid.
      # If Ollama is on the host (not this same Docker network), use the
      # Unraid box's LAN IP, e.g. http://10.0.20.5:11434
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1"

      # Optional: Google Gemini as an alternative AI provider for the quote
      # summary draft. Get a key at https://aistudio.google.com/apikey
      GEMINI_API_KEY: ""
      GEMINI_MODEL: "gemini-2.5-flash"

      # SMTP relay used to send quote emails to clients.
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "quotes@swyftech.example"
      SMTP_PASS: "changeme"
      MAIL_FROM: "SwyfTech LLC <quotes@swyftech.example>"
      # Optional: send yourself a copy of every quote email sent.
      MAIL_BCC: "jacob@swyftech.example"
    # If Ollama runs in another Docker Compose project/network on the same
    # host, either put both on a shared external network, or just use the
    # host's LAN IP in OLLAMA_BASE_URL above instead of a service name.
    # networks:
    #   - wolfden

# networks:
#   wolfden:
#     external: true
